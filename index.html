<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Matchday Scores</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0a9d58">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#10201a;--mut:#667a71;--ac:#0a9d58;--ln:#e1e8e4;--bar:#d9e2de;--red:#e03c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211b;--tx:#e8f2ec;--mut:#8aa196;--ac:#2ed47a;--ln:#243229;--bar:#2a3a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#16211b;--tx:#e8f2ec;--mut:#8aa196;--ac:#2ed47a;--ln:#243229;--bar:#2a3a31;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start}h1{margin:0;font-size:22px}h1 span{color:var(--ac)}
#gear{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 11px;font-size:16px}
#bar{margin:6px 16px;padding:7px 10px;border-radius:8px;font-size:12px;background:var(--card);border:1px solid var(--ln);color:var(--mut)}
#bar.on{color:var(--ac);border-color:var(--ac)}
#set{display:none;margin:6px 16px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--ln);font-size:13px;line-height:1.5;color:var(--mut)}
#set input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:14px}
#set button{padding:8px 14px;border-radius:8px;border:0;background:var(--ac);color:#fff;font-weight:700;margin-right:6px}
.tabs{display:flex;gap:8px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:10px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px}
.chips button{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--mut);font-size:13px}
.chips button.on{color:var(--tx);border-color:var(--ac);font-weight:700}
main{padding:0 16px 24px}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 6px}
.m{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px}
.lg{font-size:10px;color:var(--mut);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.t{flex:1;display:flex;align-items:center;gap:8px;min-width:0}.t.r{justify-content:flex-end;text-align:right}
.ab{width:34px;height:34px;border-radius:50%;background:var(--bar);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:20px;font-weight:800;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ko{font-size:15px;color:var(--ac)}
.st{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
.lv{color:var(--red);font-weight:800;animation:p 1.4s infinite}@keyframes p{50%{opacity:.35}}
.w{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;gap:2px}
.w i{display:block}.w .h{background:var(--ac)}.w .d{background:var(--bar)}.w .a{background:#e0a030}
.wl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
th,td{padding:9px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-size:11px}td:nth-child(2),th:nth-child(2){text-align:left}
td.p{font-weight:800}tr.cl td:first-child{box-shadow:inset 3px 0 var(--ac)}tr.rel td:first-child{box-shadow:inset 3px 0 var(--red)}
.note{color:var(--mut);font-size:12px;text-align:center;margin:18px 0;line-height:1.5}
</style></head><body>
<header><div><h1>Matchday <span>Scores</span></h1></div><button id="gear" aria-label="Live settings">⚙</button></header>
<div id="bar">Snapshot · 30 Oct 2026</div>
<div id="set">
<b style="color:var(--tx)">Go live</b><br>Get a free token at football-data.org, paste it here, then open this app from your own site or file (not inside Claude). The free plan shows delayed scores; real-time needs their paid “Livescores” plan.
<input id="key" placeholder="football-data.org API token" autocomplete="off">
<button id="sv">Save</button><button id="cl" style="background:var(--bar);color:var(--tx)">Clear</button>
</div>
<div class="tabs"><button id="t1" class="on">Matches</button><button id="t2">Table</button></div>
<div class="chips" id="st2"></div><div class="chips" id="lg"></div>
<main id="app"></main>
<script>
var N={IPS:"Ipswich",NFO:"Nottm Forest",AVL:"Aston Villa",MCI:"Man City",ARS:"Arsenal",EVE:"Everton",COV:"Coventry",FUL:"Fulham",CFC:"Chelsea",TOT:"Tottenham",CRY:"Crystal Palace",NEW:"Newcastle",HUL:"Hull City",BRE:"Brentford",LFC:"Liverpool",BRI:"Brighton",MUN:"Man United",BOU:"Bournemouth",SUN:"Sunderland",LEE:"Leeds",
ALA:"Alavés",MCF:"Málaga",RVC:"Rayo Vallecano",ELC:"Elche",RAC:"Racing Santander",ESP:"Espanyol",VCF:"Valencia",VIL:"Villarreal",ATM:"Atlético Madrid",DEP:"Deportivo",ATH:"Athletic Club",GET:"Getafe",RCC:"Celta Vigo",RBB:"Real Betis",RSO:"Real Sociedad",LEV:"Levante",BAR:"Barcelona",RMA:"Real Madrid",SEV:"Sevilla",OSA:"Osasuna",
VFB:"Stuttgart",COM:"Como",LIL:"Lille",GAL:"Galatasaray",VIK:"Viking",BRU:"Club Brugge",RCL:"Lens",BMU:"Bayern Munich",INT:"Inter",SHA:"Shakhtar",RBL:"RB Leipzig",FEY:"Feyenoord",SPO:"Sporting CP",ASK:"LASK",SLO:"Slovan Bratislava",BOG:"Bodø/Glimt",ROM:"Roma",PSG:"PSG",AEK:"AEK Athens"};
var LG={PL:"Premier League",PD:"La Liga",CL:"Champions League",BL1:"Bundesliga",SA:"Serie A",FL1:"Ligue 1"};
// league home away score date time [h/d/a %] — times in WAT (Nigeria)
var RAW=["PL IPS NFO 1-1 10-23 20:00","PL AVL MCI 2-1 10-24 12:30","PL ARS EVE 2-0 10-24 15:00","PL COV FUL 0-1 10-24 15:00","PL CFC TOT 0-2 10-24 17:30","PL CRY NEW 0-2 10-25 15:00","PL HUL BRE 1-1 10-25 15:00","PL LFC BRI 2-0 10-25 15:00","PL MUN BOU 0-3 10-25 15:00","PL SUN LEE 0-0 10-25 17:30",
"PL CFC MUN - 10-31 13:30 52/24.2/23.8","PL BOU LEE - 10-31 16:00 44.2/27.5/28.3","PL BRE NFO - 10-31 16:00 45.8/26.4/27.8","PL COV SUN - 10-31 16:00 31.2/27.9/40.9","PL HUL IPS - 10-31 16:00 36.5/27.5/36","PL MCI BRI - 10-31 16:00 59.1/20.9/20","PL TOT CRY - 10-31 18:30 62.3/20.5/17.2","PL AVL FUL - 10-31 21:00 49/25.2/25.8","PL LFC ARS - 11-01 17:30 32.4/27.3/40.3","PL NEW EVE - 11-02 21:00 41.4/26.4/32.2",
"PD ALA MCF 1-1 10-23 20:00","PD RVC ELC 0-3 10-24 13:00","PD RAC ESP 2-1 10-24 15:15","PD VCF VIL 1-2 10-24 17:30","PD ATM DEP 1-0 10-24 20:00","PD ATH GET 4-0 10-25 14:00","PD RCC RBB 0-0 10-25 16:15","PD RSO LEV 2-1 10-25 18:30","PD BAR RMA 1-2 10-25 21:00","PD SEV OSA 2-0 10-26 21:00",
"PD VIL ESP - 10-30 21:00 68.1/18/13.9","PD LEV ATM - 10-31 14:00 17.6/20.5/61.9","PD RVC RCC - 10-31 16:15 39.4/29.1/31.5","PD RBB MCF - 10-31 18:30 72.5/16.3/11.2","PD BAR ALA - 10-31 21:00 87.8/8/4.2","PD GET SEV - 11-01 14:00 30.3/31.5/38.2","PD RAC RMA - 11-01 16:15 8.5/11.6/79.9","PD ELC VCF - 11-01 18:30 40/28.3/31.7","PD ATH RSO - 11-01 21:00 44.6/25.9/29.5","PD DEP OSA - 11-02 21:00 43.7/29.4/26.9",
"CL VFB ATM 1-1 10-20 20:00","CL COM MUN 4-1 10-21 17:45","CL LIL GAL 2-4 10-21 17:45","CL AVL VIK 3-1 10-21 20:00","CL BRU RCL 3-0 10-21 20:00","CL BMU ARS 2-2 10-21 20:00","CL INT SHA 1-0 10-21 20:00","CL RMA RBL 4-1 10-21 20:00","CL RBB FEY 1-0 10-21 20:00","CL SPO ASK 2-3 10-21 20:00",
"CL SHA SPO - 11-03 18:45 26.6/25.5/47.9","CL GAL VFB - 11-03 18:45 42.8/24.3/32.9","CL ATM BMU - 11-03 21:00 28.9/23.4/47.7","CL BAR AVL - 11-03 21:00 78.6/12.2/9.2","CL FEY INT - 11-03 21:00 21.8/22/56.2","CL BOG LIL - 11-03 21:00 50.5/24.1/25.4","CL ASK SLO - 11-03 21:00 66.6/18.3/15.1","CL MUN ROM - 11-03 21:00 40.1/24.7/35.2","CL VIL PSG - 11-03 21:00 20.5/20.3/59.2","CL AEK RMA - 11-04 18:45 11.5/14.9/73.6"];
var SNAP=RAW.map(function(r){var f=r.split(" "),sc=f[3]==="-"?null:f[3].split("-");return{l:f[0],hc:f[1],ac:f[2],h:N[f[1]],a:N[f[2]],hs:sc&&+sc[0],as:sc&&+sc[1],s:sc?"FT":"NS",d:"2026-"+f[4],t:f[5],p:f[6]&&f[6].split("/").map(Number)}});
// [code, W, D, L, Pts] Premier League snapshot
var S=[["MCI",7,0,1,21],["ARS",7,0,1,21],["BRI",5,1,2,16],["LFC",4,3,1,15],["CFC",4,1,3,13],["BRE",2,5,1,11],["LEE",2,5,1,11],["NEW",3,2,3,11],["AVL",3,2,3,11],["HUL",2,4,2,10],["EVE",2,4,2,10],["IPS",3,1,4,10],["BOU",2,3,3,9],["TOT",2,3,3,9],["FUL",2,2,4,8],["MUN",1,4,3,7],["CRY",2,1,5,7],["NFO",1,3,4,6],["COV",2,0,6,6],["SUN",1,2,5,5]].map(function(s){return{n:N[s[0]],w:s[1],d:s[2],l:s[3],pts:s[4]}});
var M=SNAP,live=false,tab="m",sf="up",lf="ALL",TB={},app=document.getElementById("app"),bar=document.getElementById("bar");
var TODAY=new Date().toLocaleDateString("en-CA");
function key(){try{return localStorage.getItem("fdkey")||""}catch(e){return""}}
function lbl(d){return d===TODAY?"Today":new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function fmt(t){var h=+t.slice(0,2);return(h%12||12)+":"+t.slice(3)+(h<12?" AM":" PM")}
function isLive(m){return m.s==="LIVE"||m.s==="HT"}
function team(n,c,r){var b='<span class="ab">'+c+'</span>',x='<span class="nm">'+n+'</span>';return'<div class="t'+(r?' r':'')+'">'+(r?x+b:b+x)+'</div>'}
function card(m){var lv=isLive(m),fin=m.s==="FT",mid=(lv||fin)?'<div class="sc">'+m.hs+' – '+m.as+'</div>':'<div class="sc ko">'+fmt(m.t)+'</div>';
var x='<div class="m"><div class="lg">'+(LG[m.l]||m.l)+'</div><div class="row">'+team(m.h,m.hc,0)+mid+team(m.a,m.ac,1)+'</div>';
if(lv)x+='<div class="st"><span class="lv">● '+(m.s==="HT"?"HT":(m.min?m.min+"’":"LIVE"))+'</span></div>';
else if(fin)x+='<div class="st">Full time</div>';
else if(m.s==="PP")x+='<div class="st">Postponed</div>';
else if(m.p){var p=m.p;x+='<div class="w"><i class="h" style="width:'+p[0]+'%"></i><i class="d" style="width:'+p[1]+'%"></i><i class="a" style="width:'+p[2]+'%"></i></div><div class="wl"><span>'+Math.round(p[0])+'%</span><span>Draw '+Math.round(p[1])+'%</span><span>'+Math.round(p[2])+'%</span></div>'}
return x+'</div>'}
function pick(){return M.filter(function(m){return lf==="ALL"||m.l===lf})}
function matches(){var L=pick().filter(function(m){return sf==="live"?isLive(m):sf==="up"?(m.s==="NS"||m.s==="PP"):m.s==="FT"});
L.sort(function(a,b){return(a.d+a.t)<(b.d+b.t)?-1:1});if(sf==="res")L.reverse();
var h="",last="";L.forEach(function(m){if(m.d!==last){h+='<div class="day">'+lbl(m.d)+'</div>';last=m.d}h+=card(m)});
app.innerHTML=h||'<div class="note">'+(sf==="live"?"No live matches right now.":"Nothing here.")+'</div>'}
function table(){var c=lf==="ALL"?"PL":lf;if(!live&&c!=="PL"){app.innerHTML='<div class="note">Tables for this league appear in live mode.</div>';return}
var T=live?TB[c]:S;if(!T){app.innerHTML='<div class="note">Loading table…</div>';getTable(c);return}
var n=T.length,r=T.map(function(s,i){return'<tr class="'+(i<4?'cl':i>=n-3?'rel':'')+'"><td>'+(i+1)+'</td><td>'+s.n+'</td><td>'+(s.w+s.d+s.l)+'</td><td>'+s.w+'</td><td>'+s.d+'</td><td>'+s.l+'</td><td class="p">'+s.pts+'</td></tr>'}).join("");
app.innerHTML='<div class="day" style="margin-top:0">'+LG[c]+'</div><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>'+r+'</table>'}
function chips(){var ls=live?Object.keys(LG):["PL","PD","CL"],nl=M.filter(isLive).length;
document.getElementById("st2").style.display=tab==="m"?"flex":"none";
document.getElementById("st2").innerHTML=[["live","Live"+(nl?" ("+nl+")":"")],["up","Upcoming"],["res","Results"]].map(function(x){return'<button data-s="'+x[0]+'" class="'+(sf===x[0]?'on':'')+'">'+x[1]+'</button>'}).join("");
document.getElementById("lg").innerHTML=[["ALL","All"]].concat(ls.map(function(k){return[k,LG[k]]})).map(function(x){return'<button data-l="'+x[0]+'" class="'+(lf===x[0]?'on':'')+'">'+x[1]+'</button>'}).join("")}
function render(){chips();tab==="m"?matches():table();document.getElementById("t1").className=tab==="m"?"on":"";document.getElementById("t2").className=tab==="t"?"on":""}
var ST={IN_PLAY:"LIVE",LIVE:"LIVE",PAUSED:"HT",FINISHED:"FT",AWARDED:"FT",POSTPONED:"PP"};
function conv(m){var d=new Date(m.utcDate),H=m.homeTeam,A=m.awayTeam,f=m.score&&m.score.fullTime||{};
return{l:m.competition.code,h:H.shortName||H.name,a:A.shortName||A.name,hc:H.tla||"",ac:A.tla||"",hs:f.home,as:f.away,s:ST[m.status]||"NS",min:m.minute,d:d.toLocaleDateString("en-CA"),t:d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}}
function api(p){return fetch("https://api.football-data.org/v4/"+p,{headers:{"X-Auth-Token":key()}}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function load(){if(!key())return;var q=function(o){return new Date(Date.now()+o*864e5).toISOString().slice(0,10)};
api("matches?competitions=PL,PD,BL1,SA,FL1,CL&dateFrom="+q(-3)+"&dateTo="+q(6)).then(function(j){M=j.matches.map(conv);live=true;
bar.className="on";bar.textContent="● Live feed · updated "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});render()}).catch(function(e){live=false;M=SNAP;bar.className="";bar.textContent="Can’t reach the live feed ("+e.message+"). Showing the 30 Oct snapshot.";render()})}
function getTable(c){api("competitions/"+c+"/standings").then(function(j){TB[c]=j.standings[0].table.map(function(r){return{n:r.team.shortName||r.team.name,w:r.won,d:r.draw,l:r.lost,pts:r.points}});if(tab==="t")render()}).catch(function(){app.innerHTML='<div class="note">Couldn’t load the table.</div>'})}
document.getElementById("t1").onclick=function(){tab="m";render()};document.getElementById("t2").onclick=function(){tab="t";render()};
document.getElementById("st2").onclick=function(e){var s=e.target.getAttribute("data-s");if(s){sf=s;render()}};
document.getElementById("lg").onclick=function(e){var l=e.target.getAttribute("data-l");if(l){lf=l;render()}};
document.getElementById("gear").onclick=function(){var s=document.getElementById("set");s.style.display=s.style.display==="block"?"none":"block";document.getElementById("key").value=key()};
document.getElementById("sv").onclick=function(){try{localStorage.setItem("fdkey",document.getElementById("key").value.trim())}catch(e){}load()};
document.getElementById("cl").onclick=function(){try{localStorage.removeItem("fdkey")}catch(e){}document.getElementById("key").value="";live=false;M=SNAP;bar.className="";bar.textContent="Snapshot · 30 Oct 2026";render()};
render();if(key()){load();setInterval(load,30000)}
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
